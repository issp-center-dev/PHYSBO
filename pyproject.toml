[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "physbo"
version = "3.3-dev"
description = "optimization tool for PHYSics based on Bayesian Optimization"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MPL-2.0"
authors = [ { name = "PHYSBO developers", email = "physbo-dev@issp.u-tokyo.ac.jp" } ]

requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "odat-se>=3.2.0",
    "scipy",
]

[project.optional-dependencies]
odat-se = [ "odat-se" ]
docs = [
    "gitpython>=3.1.45",
    "jupyter>=1.1.1",
    "matplotlib>=3.9.4",
    "nbsphinx>=0.9.7",
    "sphinx>=7.4.7",
    "sphinx-rtd-theme>=3.0.2",
]
tutorials = [
    "jupyter>=1.1.1",
    "matplotlib>=3.9.4",
    "odat-se>=3.2.0",
    "pandas>=2.3.3",
]
tests = [
    "pytest>=8.4.2",
    "pytest-mock>=3.15.1",
]

[project.urls]
homepage = "https://www.pasums.issp.u-tokyo.ac.jp/physbo/en"
source = "https://github.com/issp-center-dev/PHYSBO"
documentation = "https://issp-center-dev.github.io/PHYSBO/"
releasenotes = "https://github.com/issp-center-dev/PHYSBO/releases"


[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]

[tool.ruff.lint]
ignore = ["E741"]
