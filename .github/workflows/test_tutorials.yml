name: Test tutorial notebooks

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 1,15 * *' # JST 9:00 AM, 1st and 15th of every month

jobs:
  build:
    name: Test ${{ matrix.lang }} tutorials with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: ['ubuntu-latest']
        python-version: ['3.13']
        lang: ['en', 'ja']
        include:
          # ubuntu-latest is Ubuntu 26.04 since 2026-10, for which setup-python
          # provides no Python 3.9 build; run 3.9 on Ubuntu 24.04.
          - os: 'ubuntu-24.04'
            python-version: '3.9'
            lang: 'en'
          - os: 'ubuntu-24.04'
            python-version: '3.9'
            lang: 'ja'

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up UV
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run:  uv sync --extra tutorials
    - name: Test tutorials
      run: |
        cd docs/sphinx/manual/${{ matrix.lang }}/source/notebook
        for notebook in *.ipynb; do
          time uv run -m jupyter execute "$notebook"
        done
