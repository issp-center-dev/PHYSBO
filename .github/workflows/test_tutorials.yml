name: Test tutorial notebooks

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 1,15 * *' # JST 9:00 AM, 1st and 15th of every month

jobs:
  build:
    name: Test ${{ matrix.lang }} tutorials with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: ['ubuntu-latest']
        python-version: ['3.9', '3.13']
        lang: ['en', 'ja']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up UV
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run:  uv sync --extra tutorials
    - name: Test tutorials
      run: |
        cd docs/sphinx/manual/${{ matrix.lang }}/source/notebook
        # parallel -j 2 uv run -m jupyter execute ::: *.ipynb
        for notebook in *.ipynb; do
          time uv run -m jupyter execute "$notebook"
        done
