name: Build and deploy documentation

# Build documentation for all branches and tags for purpose of testing.
# Deploy documentation to gh-pages only for master and develop branches, and tags.

on:
  push:
    branches: ['*']
    tags: ['*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2


    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.13'

    - name: Set up UV
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install pandoc
        uv sync --extra docs
    - name: Build docs
      run: |
        uv run bash ${{ github.workspace }}/docs/make_docs.sh

    - name: Upload built docs for deployment
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: github.ref_name == 'master' || github.ref_name == 'develop' || github.ref_type == 'tag'
      with:
        name: docs-${{ github.ref_name }}
        path: ${{ github.workspace }}/docs/built
        retention-days: 1

  deploy:
    if: github.ref_name == 'master' || github.ref_name == 'develop' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout gh-pages
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        ref: gh-pages
        path: gh-pages

    - name: Download built docs
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: docs-${{ github.ref_name }}
        path: ${{ github.workspace }}/built-docs

    - name: Deploy Configuration
      run: |
          mkdir ~/.ssh
          ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts
          echo "${{ secrets.GH_ACTIONS_DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa

    - name: Push
      env:
        GIT_USER: "PHYSBO Developers"
        GIT_EMAIL: "physbo-dev@issp.u-tokyo.ac.jp"
        TARGET_NAME: ${{ github.ref_name }}
      run: |
          cd ${GITHUB_WORKSPACE}
          for lang in ja en; do
            rm -rf "gh-pages/manual/${TARGET_NAME}/${lang}"
            mkdir -p "gh-pages/manual/${TARGET_NAME}"
            cp -r "built-docs/manual/${lang}" "gh-pages/manual/${TARGET_NAME}/"
          done
          cd gh-pages
          git config --local user.name "${GIT_USER}"
          git config --local user.email "${GIT_EMAIL}"
          git remote set-url origin git@github.com:${GITHUB_REPOSITORY}.git
          git add manual
          if git commit -m "Deploy docs to ${TARGET_NAME} by GitHub Actions triggered by ${GITHUB_SHA}"
          then
            git push origin gh-pages
          else
            echo "Nothing to deploy"
          fi
