name: Test python package

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 1,15 * *' # JST 9:00 AM, 1st and 15th of every month

jobs:
  build:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }} with NumPy ${{ matrix.numpy-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: ['ubuntu-latest']
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
        numpy-version: ['latest']
        include:
          - os: 'macos-latest'
            python-version: '3.9'
            numpy-version: 'latest'
          - os: 'macos-latest'
            python-version: '3.13'
            numpy-version: 'latest'
          - os: 'windows-latest'
            python-version: '3.9'
            numpy-version: 'latest'
          - os: 'windows-latest'
            python-version: '3.13'
            numpy-version: 'latest'
          - os: 'ubuntu-latest'
            python-version: '3.9'
            numpy-version: '1.26.4'
          - os: 'ubuntu-latest'
            python-version: '3.13'
            numpy-version: '1.26.4'

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up UV
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run:  uv sync --extra tests
    - name: Install NumPy 1.26.4
      if: matrix.numpy-version == '1.26.4'
      run: uv pip install "numpy==1.26.4"
    - name: PyTest
      run: uv run pytest --capture=sys tests
